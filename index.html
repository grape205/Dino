<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🦖 恐龍學習世界</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#071a07;min-height:100vh;font-family:'Fredoka One','Arial Rounded MT Bold',Arial,sans-serif;overflow-x:hidden}
.stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.85}}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 14px 50px}

/* HERO */
.hero{text-align:center;padding:32px 0 18px}
.hero-dino{font-size:5rem;display:inline-block;animation:dinoHero 2.5s ease-in-out infinite;filter:drop-shadow(0 6px 20px rgba(76,175,80,.5))}
@keyframes dinoHero{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.hero-title{font-size:2rem;color:#fff;line-height:1.15;margin:10px 0 4px;text-shadow:0 3px 12px rgba(76,175,80,.4)}
.hero-title em{color:#4caf50;font-style:normal}
.hero-sub{font-size:.82rem;color:#81c784;opacity:.8}

/* USER CARD */
.user-card{background:rgba(0,0,0,.45);border:2px solid rgba(92,184,92,.2);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;backdrop-filter:blur(8px)}
.uc-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #4caf50;flex-shrink:0;font-size:1.6rem;display:flex;align-items:center;justify-content:center;background:rgba(76,175,80,.15)}
.uc-info{flex:1;min-width:0}
.uc-name{font-size:1rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc-sub{font-size:.65rem;color:#81c784;opacity:.7;margin-top:2px}
.uc-stars{display:flex;align-items:center;gap:4px;background:rgba(255,179,0,.1);border:1.5px solid rgba(255,179,0,.3);border-radius:99px;padding:5px 12px;flex-shrink:0}
.uc-stars-n{font-size:1rem;color:#ffb300;font-weight:800}
.google-btn{width:100%;background:#fff;border:none;border-radius:16px;padding:14px;color:#333;font-family:'Fredoka One',Arial,sans-serif;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);margin-bottom:8px;transition:transform .15s}
.google-btn:active{transform:scale(.96)}
.google-hint{text-align:center;font-size:.68rem;color:rgba(92,184,92,.5);margin-bottom:16px}
.logout-btn{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:8px;color:#81c784;font-family:'Fredoka One',Arial,sans-serif;font-size:.78rem;cursor:pointer;margin-bottom:16px}

/* STATS */
.sec-title{font-size:.72rem;color:#81c784;opacity:.7;letter-spacing:.8px;padding:0 2px 8px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat-c{background:rgba(0,0,0,.4);border:1.5px solid rgba(92,184,92,.12);border-radius:14px;padding:10px 6px;text-align:center}
.stat-v{font-size:1.3rem;color:#fff;display:block}
.stat-l{font-size:.56rem;color:#81c784;opacity:.7;margin-top:2px;display:block}

/* GAME CARDS */
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.game-card{background:rgba(0,0,0,.45);border:2px solid rgba(92,184,92,.15);border-radius:20px;padding:18px 12px 14px;text-align:center;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;position:relative;overflow:hidden;backdrop-filter:blur(6px)}
.game-card:active{transform:scale(.93)}
.game-card-icon{font-size:2.8rem;line-height:1}
.game-card-name{font-size:.85rem;color:#fff;line-height:1.3}
.game-card-sub{font-size:.6rem;opacity:.6;color:#a5d6a7}
.game-card-badge{position:absolute;top:8px;right:8px;border-radius:99px;padding:2px 7px;font-size:.55rem;color:#fff}
.card-abc{border-color:rgba(76,175,80,.35);box-shadow:0 0 18px rgba(76,175,80,.08)}
.card-abc .game-card-badge{background:#4caf50}
.card-math{border-color:rgba(167,139,250,.35);box-shadow:0 0 18px rgba(167,139,250,.08)}
.card-math .game-card-badge{background:#7c3aed}
.card-zhuyin{border-color:rgba(255,152,0,.35);box-shadow:0 0 18px rgba(255,152,0,.08)}
.card-zhuyin .game-card-badge{background:#e65100}
.card-vocab{border-color:rgba(66,165,245,.35);box-shadow:0 0 18px rgba(66,165,245,.08);grid-column:1/-1;flex-direction:row;justify-content:center;padding:14px 20px;gap:14px}
.card-vocab .game-card-badge{background:#1565c0}
.card-vocab .game-card-icon{font-size:2.2rem}
.card-vocab .game-card-name{font-size:.95rem;text-align:left}
.card-vocab .game-card-sub{text-align:left;color:rgba(66,165,245,.7)}

/* LEADERBOARD SECTION */
.lb-section{background:rgba(0,0,0,.45);border:2px solid rgba(255,179,0,.2);border-radius:20px;padding:16px;margin-bottom:18px;backdrop-filter:blur(8px)}
.lb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.lb-title{font-size:1rem;color:#ffb300}
.lb-tabs{display:flex;gap:6px}
.lb-tab{background:rgba(0,0,0,.4);border:1.5px solid rgba(255,179,0,.2);border-radius:99px;padding:4px 12px;font-size:.65rem;color:#ffb300;cursor:pointer;font-family:'Fredoka One',Arial,sans-serif;transition:all .15s}
.lb-tab.active{background:rgba(255,179,0,.2);border-color:#ffb300}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;margin-bottom:5px;background:rgba(255,255,255,.04);transition:background .15s}
.lb-row.me{background:rgba(255,179,0,.1);border:1.5px solid rgba(255,179,0,.25)}
.lb-rank{font-size:1.1rem;width:30px;text-align:center;flex-shrink:0}
.lb-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;font-size:1rem;display:flex;align-items:center;justify-content:center;background:rgba(92,184,92,.15)}
.lb-name{flex:1;font-size:.82rem;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{font-size:.95rem;color:#ffb300;font-weight:800;flex-shrink:0}
.lb-empty{text-align:center;color:#81c784;opacity:.5;padding:20px;font-size:.85rem}
.lb-loading{text-align:center;color:#81c784;opacity:.5;padding:16px;font-size:.82rem;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
.my-rank-row{text-align:center;font-size:.72rem;color:#ffb300;opacity:.7;padding:4px 0 2px}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:10px 22px;border-radius:99px;font-size:.88rem;z-index:999;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.toast.hide{opacity:0}

/* FOOTER */
.footer{text-align:center;font-size:.6rem;color:rgba(92,184,92,.25);padding-top:10px}
</style>
</head>
<body>

<div class="stars-bg" id="starsBg"></div>

<div class="wrap">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-dino">🦖</div>
    <div class="hero-title">恐龍<em>學習</em>世界</div>
    <div class="hero-sub">Dino Learning World 🌴</div>
  </div>

  <!-- USER -->
  <div id="userCard" class="user-card" style="display:none">
    <div class="uc-avatar" id="ucAvatar">👤</div>
    <div class="uc-info">
      <div class="uc-name" id="ucName">玩家</div>
      <div class="uc-sub">已登入 ✅</div>
    </div>
    <div class="uc-stars"><span>⭐</span><span class="uc-stars-n" id="ucStars">0</span></div>
  </div>

  <div id="loginSection">
    <button class="google-btn" onclick="loginGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      用 Google 登入，開始冒險！
    </button>
    <div class="google-hint">登入後分數儲存雲端，可以和朋友比賽 ☁️</div>
  </div>

  <button id="logoutBtn" class="logout-btn" onclick="logoutUser()" style="display:none">👋 登出帳號</button>

  <!-- STATS -->
  <div class="sec-title">📊 我的紀錄</div>
  <div class="stats-row">
    <div class="stat-c"><span class="stat-v" id="statStars">0</span><span class="stat-l">⭐ 星星</span></div>
    <div class="stat-c"><span class="stat-v" id="statVocab">0</span><span class="stat-l">📖 我的單字</span></div>
    <div class="stat-c"><span class="stat-v" id="statTime">30:00</span><span class="stat-l">⏱️ 今日剩餘</span></div>
  </div>

  <!-- GAMES -->
  <div class="sec-title">🎮 選擇遊戲</div>
  <div class="game-grid">
    <a class="game-card card-abc" href="dino-abc-final.html">
      <div class="game-card-badge">字母</div>
      <div class="game-card-icon">🦖</div>
      <div class="game-card-name">字母大冒險</div>
      <div class="game-card-sub">ABC 接接樂！</div>
    </a>
    <a class="game-card card-math" href="ptero-math.html">
      <div class="game-card-badge">數學</div>
      <div class="game-card-icon">🦕</div>
      <div class="game-card-name">加法大冒險</div>
      <div class="game-card-sub">翼龍算數！</div>
    </a>
    <a class="game-card card-zhuyin" href="dino-zhuyin.html">
      <div class="game-card-badge">注音</div>
      <div class="game-card-icon">🌿</div>
      <div class="game-card-name">注音大冒險</div>
      <div class="game-card-sub">叢林注音挑戰！</div>
    </a>
    <a class="game-card card-vocab" href="dino-abc-final.html#vocab">
      <div class="game-card-badge">單字書</div>
      <div class="game-card-icon">📖</div>
      <div class="game-card-name">英文單字書</div>
      <div class="game-card-sub">新增單字，隨時複習，還能發音！</div>
    </a>
  </div>

  <!-- LEADERBOARD -->
  <div class="sec-title" style="margin-top:8px">🏆 排行榜</div>
  <div class="lb-section">
    <div class="lb-header">
      <span class="lb-title">🏆 高手排行</span>
      <div class="lb-tabs">
        <button class="lb-tab active" onclick="switchLb('abc',this)">字母</button>
        <button class="lb-tab" onclick="switchLb('math',this)">加法</button>
        <button class="lb-tab" onclick="switchLb('zhuyin',this)">注音</button>
      </div>
    </div>
    <div id="lbList"><div class="lb-loading">⏳ 載入中...</div></div>
    <div id="myRankRow" class="my-rank-row" style="display:none"></div>
  </div>

  <div class="footer">🦖 恐龍學習世界 · 為孩子打造</div>
</div>

<div class="toast hide" id="toast"></div>

<script>
const SUPA_URL='https://iizaesirhmhfwrjgabnw.supabase.co';
const SUPA_KEY='sb_publishable_e5libYdUvxTNKMnBscUvSw_8gj3QxyY';
const SITE_URL='https://grape205.github.io/Dino/index.html';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

let currentUser=null;
let currentLbGame='abc';

// ── STARS BG ──
(function(){
  const bg=document.getElementById('starsBg');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.5+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
    bg.appendChild(s);
  }
})();

// ── AUTH ──
async function initAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session)setUser(session.user);
  sb.auth.onAuthStateChange((_,s)=>{if(s)setUser(s.user);else clearUser();});
  if(location.hash.includes('access_token')){
    const {data:{session:s2}}=await sb.auth.getSession();
    if(s2){setUser(s2.user);history.replaceState(null,'',location.pathname);}
  }
  loadStats();
  loadLb('abc');
}

function setUser(user){
  currentUser=user;
  const name=user.user_metadata?.full_name||user.email||'玩家';
  const avatar=user.user_metadata?.avatar_url||'';
  document.getElementById('loginSection').style.display='none';
  document.getElementById('logoutBtn').style.display='block';
  const uc=document.getElementById('userCard');
  uc.style.display='flex';
  document.getElementById('ucName').textContent=name.split(' ')[0];
  const av=document.getElementById('ucAvatar');
  if(avatar){av.innerHTML=`<img src="${avatar}" style="width:46px;height:46px;border-radius:50%;object-fit:cover">`;}
  else{av.textContent='👤';}
  loadStats();
  loadLb(currentLbGame);
  showToast('👋 歡迎回來，'+name.split(' ')[0]+'！');
}

function clearUser(){
  currentUser=null;
  document.getElementById('loginSection').style.display='block';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('userCard').style.display='none';
}

async function loginGoogle(){
  await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:SITE_URL}});
}
async function logoutUser(){
  await sb.auth.signOut();
  clearUser();
  showToast('已登出！');
}

// ── STATS ──
function loadStats(){
  const stars=parseInt(localStorage.getItem('stars')||'0');
  document.getElementById('statStars').textContent=stars;
  document.getElementById('ucStars').textContent=stars;
  const vocab=JSON.parse(localStorage.getItem('vocabWords')||'[]').length;
  document.getElementById('statVocab').textContent=vocab;
  const todayKey='dino_'+new Date().toISOString().slice(0,10);
  const PLAY_LIMIT=30*60;
  const used=parseInt(localStorage.getItem('used_'+todayKey)||'0');
  const rem=Math.max(0,PLAY_LIMIT-used);
  const m=Math.floor(rem/60),s=rem%60;
  document.getElementById('statTime').textContent=m+':'+(s<10?'0':'')+s;
}

// ── LEADERBOARD ──
const GAME_LABELS={abc:'🦖 字母遊戲',math:'🦕 加法遊戲',zhuyin:'🌿 注音遊戲'};
const MEDALS=['🥇','🥈','🥉'];

async function loadLb(game){
  currentLbGame=game;
  const list=document.getElementById('lbList');
  list.innerHTML='<div class="lb-loading">⏳ 載入中...</div>';
  document.getElementById('myRankRow').style.display='none';

  try{
    const {data,error}=await sb
      .from('leaderboard')
      .select('player_name,score,user_id')
      .eq('game',game)
      .order('score',{ascending:false})
      .limit(20);

    if(error||!data||data.length===0){
      list.innerHTML='<div class="lb-empty">還沒有紀錄！<br>快去打一場成為第一名！🏆</div>';
      return;
    }

    // 每人取最高分
    const best={};
    data.forEach(r=>{
      if(!best[r.user_id]||r.score>best[r.user_id].score)best[r.user_id]={...r};
    });
    const sorted=Object.values(best).sort((a,b)=>b.score-a.score).slice(0,10);

    list.innerHTML=sorted.map((r,i)=>{
      const isMe=currentUser&&r.user_id===currentUser.id;
      return `<div class="lb-row${isMe?' me':''}">
        <span class="lb-rank">${MEDALS[i]||(i+1)+'.'}</span>
        <span class="lb-avatar">${isMe?'😊':'🦖'}</span>
        <span class="lb-name">${escHtml(r.player_name)}${isMe?' <span style="font-size:.6rem;color:#ffb300">(我)</span>':''}</span>
        <span class="lb-score">${r.score}分</span>
      </div>`;
    }).join('');

    // 我的排名
    if(currentUser){
      const myIdx=sorted.findIndex(r=>r.user_id===currentUser.id);
      const mr=document.getElementById('myRankRow');
      if(myIdx>=0){
        mr.style.display='block';
        mr.textContent=`你在${GAME_LABELS[game]}排名第 ${myIdx+1} 名 🎉`;
      } else {
        mr.style.display='block';
        mr.textContent='你還沒有紀錄，快去玩一場！';
      }
    }
  }catch(e){
    list.innerHTML='<div class="lb-empty">載入失敗，請稍後再試</div>';
  }
}

function switchLb(game,btn){
  document.querySelectorAll('.lb-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadLb(game);
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── TOAST ──
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.remove('hide');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hide'),2800);
}

// ── INIT ──
initAuth();

// 每30秒刷新排行榜
setInterval(()=>loadLb(currentLbGame),30000);
</script>
</body>
</html>
