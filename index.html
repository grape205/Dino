<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🦖 恐龍學習世界</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#071a07;
  font-family:'Fredoka One','Arial Rounded MT Bold',Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;
}

/* 星星背景 */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.7}}

/* 主卡片 */
.card{
  position:relative;z-index:1;
  text-align:center;
  padding:48px 32px 40px;
  width:min(340px,90vw);
}

/* 恐龍 */
.dino{
  font-size:6rem;
  display:block;
  animation:dinoFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 8px 24px rgba(76,175,80,.5));
  margin-bottom:20px;
}
@keyframes dinoFloat{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-14px) rotate(4deg)}
}

/* 標題 */
.title{
  font-size:2.2rem;color:#fff;line-height:1.2;
  text-shadow:0 3px 16px rgba(76,175,80,.4);
  margin-bottom:6px;
}
.title em{color:#4caf50;font-style:normal}
.subtitle{
  font-size:.85rem;color:#81c784;opacity:.75;
  margin-bottom:36px;
}

/* Google 按鈕 */
.google-btn{
  width:100%;
  background:#fff;
  border:none;border-radius:16px;
  padding:16px 20px;
  color:#333;
  font-family:'Fredoka One',Arial,sans-serif;
  font-size:1.05rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 6px 28px rgba(0,0,0,.4);
  transition:transform .15s,box-shadow .15s;
  margin-bottom:14px;
}
.google-btn:active{transform:scale(.95);box-shadow:0 2px 10px rgba(0,0,0,.3)}

/* 先進去 */
.skip-btn{
  background:transparent;border:none;
  color:rgba(129,199,132,.5);
  font-family:'Fredoka One',Arial,sans-serif;
  font-size:.78rem;cursor:pointer;
  text-decoration:underline;
  transition:color .2s;
}
.skip-btn:active{color:#81c784}

/* 載入中 */
.loading{
  display:none;
  font-size:.9rem;color:#81c784;
  animation:pulse .8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card">
  <span class="dino">🦖</span>
  <div class="title">恐龍<em>學習</em>世界</div>
  <div class="subtitle">Dino Learning World 🌴</div>

  <button class="google-btn" id="loginBtn" onclick="loginGoogle()">
    <svg width="22" height="22" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    用 Google 登入
  </button>

  <div class="loading" id="loading">⏳ 登入中...</div>
  <button class="skip-btn" id="skipBtn" onclick="goToMain()">先不登入，直接進去 →</button>
</div>

<script>
const SUPA_URL='https://iizaesirhmhfwrjgabnw.supabase.co';
const SUPA_KEY='sb_publishable_e5libYdUvxTNKMnBscUvSw_8gj3QxyY';
const MAIN='https://grape205.github.io/Dino/dino-abc-final.html';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

// 星星背景
(function(){
  const bg=document.getElementById('stars');
  for(let i=0;i<55;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.2+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s`;
    bg.appendChild(s);
  }
})();

async function init(){
  const hash=location.hash;
  const params=new URLSearchParams(location.search);
  // 同時支援 implicit flow (#access_token) 和 PKCE flow (?code=)
  const isOAuthCallback=(hash&&hash.includes('access_token'))||params.has('code');
  if(isOAuthCallback){
    document.getElementById('loginBtn').style.display='none';
    document.getElementById('skipBtn').style.display='none';
    document.getElementById('loading').style.display='block';
    // 等 Supabase 處理完 session（PKCE 需要稍等）
    await new Promise(r=>setTimeout(r,1200));
    const {data:{session}}=await sb.auth.getSession();
    if(session){
      history.replaceState(null,'',location.pathname);
      location.replace(MAIN);
      return;
    }
  }
  // 已有 session 直接跳
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    location.replace(MAIN);
    return;
  }
  // 沒登入就顯示登入頁（預設已顯示）
}

async function loginGoogle(){
  document.getElementById('loginBtn').style.display='none';
  document.getElementById('skipBtn').style.display='none';
  document.getElementById('loading').style.display='block';
  await sb.auth.signInWithOAuth({
    provider:'google',
    options:{
      redirectTo:'https://grape205.github.io/Dino/index.html',
      queryParams:{prompt:'select_account'}
    }
  });
}

function goToMain(){
  location.href=MAIN;
}

init();
</script>
<!-- AADS bottom banner -->
<div style="position:fixed;bottom:0;left:0;right:0;z-index:900;pointer-events:none" id="aadsBannerIndex">
  <input autocomplete="off" type="checkbox" id="aadsCloseIndex" hidden>
  <div style="pointer-events:auto;position:relative">
    <label for="aadsCloseIndex" style="position:absolute;top:-22px;right:8px;background:rgba(7,26,7,.9);border:1px solid rgba(74,222,128,.35);border-radius:99px;padding:2px 9px;color:#86efac;font-size:.65rem;cursor:pointer;font-family:'Fredoka One',Arial,sans-serif">✕ 關閉</label>
    <div style="width:100%;background:rgba(7,26,7,.97);border-top:1px solid rgba(74,222,128,.25);display:flex;justify-content:center;padding:3px 0">
      <iframe data-aa='2440074' src='//acceptable.a-ads.com/2440074/?size=Adaptive' style='border:0;padding:0;width:100%;height:50px;overflow:hidden;display:block;margin:auto'></iframe>
    </div>
  </div>
  <style>#aadsCloseIndex:checked+div{display:none}</style>
</div>
</body>
</html>
