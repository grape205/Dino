<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>🦕 恐龍天平大挑戰</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#071a07;min-height:100vh;overflow-x:hidden;user-select:none;color:#fff}

/* jungle bg */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% -10%,#0f3d14 0%,#0a2a0d 45%,#061806 100%)}
.bg::before{content:'';position:absolute;inset:0;background-image:
  radial-gradient(2px 2px at 12% 12%,rgba(180,255,180,.5),transparent),
  radial-gradient(1.5px 1.5px at 32% 6%,rgba(180,255,180,.35),transparent),
  radial-gradient(2px 2px at 68% 10%,rgba(180,255,180,.5),transparent),
  radial-gradient(1.5px 1.5px at 84% 16%,rgba(180,255,180,.35),transparent),
  radial-gradient(2px 2px at 50% 4%,rgba(180,255,180,.45),transparent)}
.leaf{position:fixed;font-size:2.4rem;opacity:.10;z-index:0;pointer-events:none;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

.wrap{max-width:480px;margin:0 auto;position:relative;z-index:1;padding:0 12px 90px;min-height:100vh}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 6px}
.logo{display:flex;align-items:center;gap:8px}
.logo-d{font-size:2.2rem;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(76,175,80,.5))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.logo-t{font-family:'Fredoka One',cursive;font-size:1.05rem;color:#7ee081;line-height:1.15;text-shadow:0 2px 8px rgba(76,175,80,.4)}
.logo-s{font-size:.6rem;color:#4caf50;font-weight:800}
.home{font-size:1.5rem;text-decoration:none}
.star-pill{background:linear-gradient(135deg,#1b5e20,#4caf50,#7ee081);border-radius:50px;padding:6px 12px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 14px rgba(76,175,80,.45)}
.sp-star{font-size:1.1rem;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-n{font-family:'Fredoka One',cursive;font-size:1.3rem;color:#fff;line-height:1}

/* ===== LEVEL SELECT ===== */
#selectView{padding-top:4px}
.progress-bar{background:rgba(255,255,255,.08);border-radius:99px;height:14px;margin:6px 2px 14px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#4caf50,#7ee081);border-radius:99px;transition:width .5s;width:0}
.progress-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}

.chapter{margin-bottom:16px;background:rgba(255,255,255,.04);border-radius:16px;padding:12px 12px 14px;border:1px solid rgba(126,224,129,.12)}
.ch-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ch-emoji{font-size:1.7rem}
.ch-title{font-family:'Fredoka One',cursive;font-size:1rem;color:#7ee081}
.ch-sub{font-size:.62rem;color:#9ccc9e}
.ch-lock{margin-left:auto;font-size:1.1rem;opacity:.7}
.lv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lv{aspect-ratio:1;border-radius:12px;border:none;background:linear-gradient(135deg,#1b5e20,#388e3c);color:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .1s}
.lv:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.lv.locked{background:rgba(255,255,255,.06);color:rgba(255,255,255,.25);box-shadow:none;cursor:not-allowed}
.lv.done{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.lv .lvstars{position:absolute;bottom:2px;left:0;right:0;font-size:.5rem;line-height:1;letter-spacing:-1px}
.lv .lvlock{font-size:.9rem}

/* ===== PLAY ===== */
#playView{display:none;padding-top:2px}
.pbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px}
.back-btn{background:rgba(255,255,255,.1);border:none;border-radius:99px;padding:8px 14px;color:#7ee081;font-family:'Fredoka One',cursive;font-size:.85rem;cursor:pointer}
.lv-badge{font-family:'Fredoka One',cursive;font-size:1rem;color:#fbbf24}
.scoreline{display:flex;gap:14px;font-size:.8rem;font-weight:900}
.sc-ok{color:#7ee081}.sc-no{color:#ef9a9a}

.stage{position:relative;height:230px;margin:10px 0 4px;display:flex;align-items:flex-end;justify-content:center}
.beam-eq{position:absolute;top:8px;left:0;right:0;text-align:center;font-family:'Fredoka One',cursive;font-size:clamp(1.5rem,7vw,2.3rem);color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.6);z-index:3;transition:transform .5s cubic-bezier(.34,1.56,.64,1);transform-origin:50% 380%}
.qmark{color:#fbbf24;animation:qpulse 1.2s ease-in-out infinite}
@keyframes qpulse{0%,100%{opacity:.6}50%{opacity:1}}
.beam{position:absolute;top:74px;left:50%;width:86%;height:14px;background:linear-gradient(180deg,#7ee081,#4caf50);border-radius:8px;transform:translateX(-50%) rotate(0deg);transform-origin:50% 50%;transition:transform .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 3px 8px rgba(0,0,0,.4);z-index:2}
.beam.tilt{transform:translateX(-50%) rotate(-9deg)}
.beam.tilt2{transform:translateX(-50%) rotate(9deg)}
.fulcrum{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:5rem;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));z-index:1;transition:transform .3s}
.fulcrum.happy{animation:hop .5s ease}
@keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-18px)}}
.prompt{text-align:center;font-weight:900;font-size:.95rem;color:#c8e6c9;margin:2px 0 12px;min-height:1.3em}
.prompt.win{color:#7ee081}
.prompt.lose{color:#ef9a9a}

.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.opt{aspect-ratio:.82;border-radius:14px;border:3px solid rgba(126,224,129,.35);background:#fff;color:#1b3a1c;font-family:'Fredoka One',cursive;font-size:clamp(1.1rem,5.5vw,1.6rem);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}
.opt:active{transform:translateY(2px)}
.opt.correct{background:#7ee081;border-color:#2e7d32;color:#fff;animation:pop .3s}
.opt.wrong{background:#ef9a9a;border-color:#c62828;color:#fff}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.opt.disabled{pointer-events:none;opacity:.55}

.next-wrap{text-align:center;min-height:60px}
.next-btn{background:linear-gradient(135deg,#f59e0b,#fbbf24);border:none;border-radius:99px;padding:15px 30px;color:#fff;font-family:'Fredoka One',cursive;font-size:1.15rem;cursor:pointer;box-shadow:0 6px 18px rgba(245,158,11,.5);animation:pop .4s}
.retry-btn{background:linear-gradient(135deg,#455a64,#78909c);border:none;border-radius:99px;padding:13px 26px;color:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;margin-top:8px}

/* confetti */
.cfx{position:fixed;top:-10px;font-size:1.2rem;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}

/* chapter clear overlay */
.ov{position:fixed;inset:0;background:rgba(3,15,3,.85);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex}
.ov-card{background:linear-gradient(160deg,#123d16,#0a2a0d);border:2px solid rgba(126,224,129,.4);border-radius:24px;padding:28px 24px;text-align:center;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ov-emoji{font-size:4rem;animation:bob 2s ease-in-out infinite;display:inline-block}
.ov-title{font-family:'Fredoka One',cursive;font-size:1.4rem;color:#fbbf24;margin:10px 0 6px}
.ov-sub{font-size:.85rem;color:#c8e6c9;margin-bottom:18px;line-height:1.5}
.ov-btn{background:linear-gradient(135deg,#4caf50,#7ee081);border:none;border-radius:99px;padding:14px 28px;color:#fff;font-family:'Fredoka One',cursive;font-size:1.05rem;cursor:pointer}
</style>
</head>
<body>
<div class="bg"></div>
<span class="leaf" style="top:12%;left:-2%">🌿</span>
<span class="leaf" style="top:40%;right:-2%;animation-delay:1.5s">🍃</span>
<span class="leaf" style="bottom:14%;left:2%;animation-delay:3s">🌴</span>

<div class="wrap">
  <div class="hdr">
    <div class="logo">
      <span class="logo-d">🦕</span>
      <div>
        <div class="logo-t">恐龍天平</div>
        <div class="logo-s">DINO BALANCE · 100 關</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="star-pill"><span class="sp-star">⭐</span><span class="sp-n" id="starTotal">0</span></div>
      <a class="home" href="index.html">🏠</a>
    </div>
  </div>

  <!-- ===== SELECT ===== -->
  <div id="selectView">
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div><div class="progress-txt" id="progTxt">0 / 100 關</div></div>
    <div id="chapters"></div>
  </div>

  <!-- ===== PLAY ===== -->
  <div id="playView">
    <div class="pbar">
      <button class="back-btn" onclick="backToSelect()">← 選關</button>
      <span class="lv-badge" id="lvBadge">第 1 關</span>
      <div class="scoreline"><span class="sc-ok">✅ <span id="okN">0</span></span><span class="sc-no">❌ <span id="noN">0</span></span></div>
    </div>

    <div class="stage">
      <div class="beam-eq" id="beamEq"></div>
      <div class="beam" id="beam"></div>
      <div class="fulcrum" id="fulcrum">🦖</div>
    </div>

    <div class="prompt" id="prompt">放一個數字，讓天平平衡！</div>

    <div class="opts" id="opts"></div>
    <div class="next-wrap" id="nextWrap"></div>
  </div>
</div>

<!-- chapter clear overlay -->
<div class="ov" id="ov">
  <div class="ov-card">
    <span class="ov-emoji" id="ovEmoji">🏆</span>
    <div class="ov-title" id="ovTitle">章節完成！</div>
    <div class="ov-sub" id="ovSub"></div>
    <button class="ov-btn" onclick="closeOv()">太棒了！</button>
  </div>
</div>

<script>
// ══════════ CHAPTERS ══════════
// 10 章 × 每章 10 關 = 100 關
const CHAPTERS = [
  {emoji:'🥚', name:'蛋窩淺灘',   sub:'10 以內的加法',       cap:10,  terms:2},
  {emoji:'🌿', name:'蕨葉草原',   sub:'15 以內的加法',       cap:15,  terms:2},
  {emoji:'🦖', name:'迅猛龍谷',   sub:'20 以內的加法',       cap:20,  terms:2},
  {emoji:'🔺', name:'三角龍丘',   sub:'30 以內的加法',       cap:30,  terms:2},
  {emoji:'🌋', name:'劍龍森林',   sub:'50 以內的加法',       cap:50,  terms:2},
  {emoji:'🛡️', name:'甲龍峽谷',   sub:'兩邊都要加起來',      cap:50,  terms:3},
  {emoji:'🪽', name:'翼龍高崖',   sub:'70 以內的挑戰',       cap:70,  terms:2},
  {emoji:'💧', name:'腕龍濕地',   sub:'三個數字相加',        cap:80,  terms:3},
  {emoji:'👑', name:'暴龍火山',   sub:'100 以內大魔王',      cap:100, terms:2},
  {emoji:'🌟', name:'恐龍王國',   sub:'終極平衡大挑戰',      cap:120, terms:3},
];
const DINOS=['🦕','🦖','🦕','🦖','🦴','🥚','🐉','🦎','🦕','🦖'];

// ══════════ STATE ══════════
const LS_KEY='dinoScaleProgress';
let progress = loadProgress();   // {maxUnlocked:int, stars:{levelId:1}}
let curLevel = 1;
let ok=0, no=0;                  // per-play session counters（本關內）
let answered=false;
let curAnswer=0;

function loadProgress(){
  try{
    const p=JSON.parse(localStorage.getItem(LS_KEY));
    if(p&&typeof p.maxUnlocked==='number') return p;
  }catch(e){}
  return {maxUnlocked:1, stars:{}};
}
function saveProgress(){ try{localStorage.setItem(LS_KEY,JSON.stringify(progress));}catch(e){} }
function totalStars(){ return Object.keys(progress.stars).length; }

// ══════════ AUDIO ══════════
let _ac=null;
function AC(){ if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)(); return _ac; }
function note(f,d,type,v,delay){type=type||'sine';v=v||.18;delay=delay||0;
  try{const a=AC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
  o.type=type;o.frequency.setValueAtTime(f,a.currentTime+delay);
  g.gain.setValueAtTime(0,a.currentTime+delay);g.gain.linearRampToValueAtTime(v,a.currentTime+delay+.01);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+d);
  o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d+.05);}catch(e){}}
function sndOk(){note(523,.1,'sine',.22,0);note(659,.1,'sine',.2,.1);note(784,.14,'sine',.2,.2);note(1047,.26,'sine',.16,.3);}
function sndNo(){note(180,.07,'sawtooth',.22,0);note(140,.2,'sawtooth',.16,.08);}
function sndTap(){note(760,.04,'triangle',.14,0);}

// ══════════ LEVEL GENERATION ══════════
// 依關卡編號 (1-100) 產生一道題目：左邊加總 = 右邊加總，其中一個加數是「?」
function levelConfig(id){
  const ch=Math.ceil(id/100*10)-0.0000001; // safe
  const chIdx=Math.min(9,Math.floor((id-1)/10));
  return CHAPTERS[chIdx];
}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}

function makePuzzle(id){
  const cfg=levelConfig(id);
  const cap=cfg.cap;
  const inCh=((id-1)%10)+1;               // 1..10 該章內的第幾關
  // 目標總和：章內由淺到深
  const lo=Math.max(cfg.terms, Math.round(cap*0.35));
  const total=Math.min(cap, randInt(lo + (inCh-1), cap));
  // 左邊拆成 terms 個加數
  const left=splitInto(total, cfg.terms);
  // 右邊：一個已知加數 known + 未知 ?（答案）
  // known 介於 0..total-1，答案 = total - known
  let known=randInt(0, Math.max(0,total-1));
  let answer=total-known;
  // 避免答案就是 0（太無聊）盡量；但保留可能性
  if(answer===0 && total>1){ known=randInt(0,total-1); answer=total-known; }
  return {left, known, answer, total};
}
// 把 sum 拆成 n 個 >=1（若 sum<n 允許 0）的加數
function splitInto(sum,n){
  const parts=[];
  let remain=sum;
  for(let i=0;i<n-1;i++){
    const maxHere=remain-(n-1-i)* (sum>=n?1:0);
    const minHere=(sum>=n)?1:0;
    const v=randInt(Math.max(0,minHere), Math.max(minHere,maxHere));
    parts.push(v); remain-=v;
  }
  parts.push(Math.max(0,remain));
  return parts;
}

function makeOptions(answer,cap){
  const set=new Set([answer]);
  let guard=0;
  while(set.size<5 && guard++<200){
    let d=answer + randInt(-4,4);
    if(d<0) d=randInt(0,Math.min(cap,answer+5));
    if(d>cap+2) continue;
    set.add(d);
  }
  // 若還不足（answer 很小），補些
  let n=0;
  while(set.size<5 && n<=cap){ set.add(n); n++; }
  const arr=[...set].slice(0,5);
  // shuffle
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

// ══════════ RENDER SELECT ══════════
function renderSelect(){
  document.getElementById('starTotal').textContent=totalStars();
  const done=totalStars();
  document.getElementById('progFill').style.width=(done)+'%';
  document.getElementById('progTxt').textContent=done+' / 100 關';

  const box=document.getElementById('chapters');
  box.innerHTML='';
  CHAPTERS.forEach((ch,ci)=>{
    const firstLv=ci*10+1;
    const chapUnlocked = progress.maxUnlocked>=firstLv;
    const el=document.createElement('div');
    el.className='chapter';
    let grid='';
    for(let i=0;i<10;i++){
      const id=firstLv+i;
      const unlocked=progress.maxUnlocked>=id;
      const done=!!progress.stars[id];
      if(!unlocked){
        grid+=`<button class="lv locked" disabled><span class="lvlock">🔒</span></button>`;
      }else{
        grid+=`<button class="lv ${done?'done':''}" onclick="startLevel(${id})">${id}${done?'<span class="lvstars">⭐</span>':''}</button>`;
      }
    }
    el.innerHTML=`
      <div class="ch-head">
        <span class="ch-emoji">${ch.emoji}</span>
        <div>
          <div class="ch-title">第 ${ci+1} 章 · ${ch.name}</div>
          <div class="ch-sub">${ch.sub}（第 ${firstLv}–${firstLv+9} 關）</div>
        </div>
        <span class="ch-lock">${chapUnlocked?'':'🔒'}</span>
      </div>
      <div class="lv-grid">${grid}</div>`;
    box.appendChild(el);
  });
}

// ══════════ PLAY ══════════
function startLevel(id){
  if(progress.maxUnlocked<id) return;
  try{AC().resume();}catch(e){}
  curLevel=id; ok=0; no=0;
  document.getElementById('selectView').style.display='none';
  document.getElementById('playView').style.display='block';
  const chIdx=Math.floor((id-1)/10);
  document.getElementById('fulcrum').textContent=DINOS[chIdx];
  document.getElementById('lvBadge').textContent='第 '+id+' 關';
  updateScore();
  newRound();
  window.scrollTo(0,0);
}

function updateScore(){ document.getElementById('okN').textContent=ok; document.getElementById('noN').textContent=no; }

let P=null;
function newRound(){
  answered=false;
  const cfg=levelConfig(curLevel);
  P=makePuzzle(curLevel);
  curAnswer=P.answer;
  // 顯示等式：left1 + left2 (+ left3) = known + ?
  const leftStr=P.left.join(' + ');
  const rightStr=`${P.known} + <span class="qmark">?</span>`;
  document.getElementById('beamEq').innerHTML=`${leftStr} = ${rightStr}`;
  document.getElementById('beamEq').style.transform='rotate(0deg)';
  const beam=document.getElementById('beam');
  beam.className='beam';
  const prompt=document.getElementById('prompt');
  prompt.className='prompt'; prompt.textContent='放一個數字，讓天平平衡！';
  document.getElementById('fulcrum').className='fulcrum';
  document.getElementById('nextWrap').innerHTML='';

  const opts=makeOptions(P.answer,cfg.cap);
  const ob=document.getElementById('opts');
  ob.innerHTML='';
  opts.forEach(v=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=v;
    b.onclick=()=>choose(b,v);
    ob.appendChild(b);
  });
}

function choose(btn,v){
  if(answered) return;
  answered=true;
  sndTap();
  const correct = (v===curAnswer);
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  const beam=document.getElementById('beam');
  const eq=document.getElementById('beamEq');
  const prompt=document.getElementById('prompt');
  const fulcrum=document.getElementById('fulcrum');

  if(correct){
    btn.classList.add('correct');
    beam.className='beam';               // 平衡
    eq.style.transform='rotate(0deg)';
    ok++; updateScore();
    prompt.className='prompt win'; prompt.textContent='🎉 平衡了！你答對了！';
    fulcrum.classList.add('happy');
    sndOk(); confetti();
    // 記錄星星 + 解鎖下一關
    const firstTime = !progress.stars[curLevel];
    progress.stars[curLevel]=1;
    if(progress.maxUnlocked < curLevel+1 && curLevel<100){
      progress.maxUnlocked=curLevel+1;
    }
    saveProgress();
    document.getElementById('starTotal').textContent=totalStars();
    showNext(firstTime);
  }else{
    btn.classList.add('wrong');
    // 標出正確答案
    document.querySelectorAll('.opt').forEach(o=>{ if(parseInt(o.textContent)===curAnswer) o.classList.add('correct'); });
    beam.className='beam tilt2';         // 傾斜
    eq.style.transform='rotate(9deg)';
    no++; updateScore();
    prompt.className='prompt lose'; prompt.textContent=`不平衡～正確答案是 ${curAnswer}`;
    sndNo();
    showRetry();
  }
}

function showNext(firstTime){
  const nw=document.getElementById('nextWrap');
  const isLast = curLevel>=100;
  const chapEnd = (curLevel%10===0);
  let label = isLast ? '🏆 全部完成！回選關' : (chapEnd ? '⭐ 下一章！' : '下一關 →');
  nw.innerHTML=`<button class="next-btn" onclick="goNext()">${label}</button>`;
  if(chapEnd && firstTime && !isLast) setTimeout(()=>chapterClear(Math.floor((curLevel-1)/10)),450);
  if(isLast && firstTime) setTimeout(()=>allClear(),450);
}
function showRetry(){
  document.getElementById('nextWrap').innerHTML=`<button class="retry-btn" onclick="newRound()">🔄 再試一次</button>`;
}
function goNext(){
  if(curLevel>=100){ backToSelect(); return; }
  curLevel++;
  const chIdx=Math.floor((curLevel-1)/10);
  document.getElementById('fulcrum').textContent=DINOS[chIdx];
  document.getElementById('lvBadge').textContent='第 '+curLevel+' 關';
  newRound();
  window.scrollTo(0,0);
}

function backToSelect(){
  document.getElementById('playView').style.display='none';
  document.getElementById('selectView').style.display='block';
  renderSelect();
  window.scrollTo(0,0);
}

// ══════════ OVERLAYS ══════════
function chapterClear(chIdx){
  const ch=CHAPTERS[chIdx];
  document.getElementById('ovEmoji').textContent=ch.emoji;
  document.getElementById('ovTitle').textContent='第 '+(chIdx+1)+' 章完成！';
  document.getElementById('ovSub').innerHTML=`你征服了「${ch.name}」！<br>下一章更精彩，繼續加油 🦕`;
  document.getElementById('ov').classList.add('open');
}
function allClear(){
  document.getElementById('ovEmoji').textContent='👑';
  document.getElementById('ovTitle').textContent='恐龍天平大師！';
  document.getElementById('ovSub').innerHTML='哇！你破了全部 100 關！<br>你是最厲害的平衡大師 🌟🦕🌟';
  document.getElementById('ov').classList.add('open');
}
function closeOv(){ document.getElementById('ov').classList.remove('open'); }

// ══════════ CONFETTI ══════════
function confetti(){
  const emo=['⭐','🌟','🦕','🦖','🍃','✨'];
  for(let i=0;i<18;i++){
    const c=document.createElement('div');
    c.className='cfx'; c.textContent=emo[Math.floor(Math.random()*emo.length)];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(1.2+Math.random()*1.3)+'s';
    c.style.animationDelay=(Math.random()*.3)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

// ══════════ INIT ══════════
renderSelect();

document.body.addEventListener('click',()=>{try{AC().resume();}catch(e){}},{once:true});
