<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🥚 恐龍考古大冒險</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{
  font-family:'Fredoka One',Arial,sans-serif;
  background:#0a0a1a;
  min-height:100vh;
  overflow-x:hidden;
  user-select:none;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* starry background */
.skybg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,#0a0a2e 0%,#1a1a4a 40%,#0d0d25 100%);
}
.skybg::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 8% 6%,rgba(255,255,220,.9),transparent),
    radial-gradient(1px 1px at 22% 3%,rgba(255,255,220,.7),transparent),
    radial-gradient(2px 2px at 45% 8%,rgba(255,255,220,.95),transparent),
    radial-gradient(1px 1px at 65% 2%,rgba(255,255,220,.6),transparent),
    radial-gradient(1.5px 1.5px at 80% 7%,rgba(255,255,220,.8),transparent),
    radial-gradient(1px 1px at 92% 12%,rgba(255,255,220,.7),transparent),
    radial-gradient(1px 1px at 35% 15%,rgba(255,255,220,.5),transparent),
    radial-gradient(1.5px 1.5px at 55% 4%,rgba(255,255,220,.8),transparent),
    radial-gradient(1px 1px at 12% 18%,rgba(255,255,220,.4),transparent),
    radial-gradient(1.5px 1.5px at 70% 14%,rgba(255,255,220,.6),transparent),
    radial-gradient(1px 1px at 88% 20%,rgba(255,255,220,.5),transparent);
}
.skybg::after{
  content:'🌙';position:absolute;top:14px;right:20px;font-size:2rem;
  filter:drop-shadow(0 0 20px rgba(200,200,100,.8));
  animation:moonGlow 4s ease-in-out infinite;
}
@keyframes moonGlow{
  0%,100%{filter:drop-shadow(0 0 16px rgba(200,200,100,.6))}
  50%{filter:drop-shadow(0 0 36px rgba(200,200,100,1))}
}

/* main wrapper */
#app{
  position:relative;z-index:1;
  width:100%;max-width:520px;
  padding:12px;
  padding-top:60px;
  display:flex;flex-direction:column;align-items:center;
  gap:14px;
}

/* HUD */
#hud{
  width:100%;
  background:rgba(255,255,255,0.07);
  border:1.5px solid rgba(255,255,255,0.15);
  border-radius:20px;
  padding:12px 16px;
  display:flex;flex-direction:column;gap:8px;
}
#hud-top{
  display:flex;align-items:center;justify-content:space-between;
}
#level-label{
  font-size:1.6rem;color:#ffe066;
  text-shadow:0 0 16px rgba(255,224,102,.8);
  letter-spacing:1px;
}
#grid-info{
  font-size:0.9rem;color:rgba(255,255,255,0.6);
  letter-spacing:0.5px;
}
#egg-info{
  font-size:1rem;color:#ffb3c6;
  letter-spacing:0.5px;
}
#hud-bottom{
  display:flex;justify-content:center;
}

/* mode toggle button */
#mode-btn{
  font-family:'Fredoka One',Arial,sans-serif;
  font-size:1.25rem;
  padding:10px 28px;
  border:none;border-radius:50px;
  cursor:pointer;
  transition:all 0.2s;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
  letter-spacing:0.5px;
  min-width:200px;
}
#mode-btn.dig{
  background:linear-gradient(135deg,#f9c74f,#f8961e);
  color:#3d1a00;
}
#mode-btn.flag{
  background:linear-gradient(135deg,#90e0ef,#0096c7);
  color:#001a2c;
}
#mode-btn:active{transform:scale(0.95);}

/* grid */
#grid-wrapper{
  display:flex;justify-content:center;align-items:center;
}
#grid{
  display:grid;
  gap:5px;
}

/* cells */
.cell{
  width:60px;height:60px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;
  font-family:'Fredoka One',Arial,sans-serif;
  cursor:pointer;
  transition:transform 0.1s, background 0.2s, box-shadow 0.2s;
  position:relative;
  border:none;
  outline:none;
}
/* unrevealed */
.cell.hidden{
  background:linear-gradient(145deg,#c8a97a,#a07850);
  box-shadow:
    2px 2px 0px #6b4e2e,
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -1px 0 rgba(0,0,0,0.2);
}
.cell.hidden:hover{
  background:linear-gradient(145deg,#d4b98a,#b08860);
  transform:scale(1.05);
}
.cell.hidden:active{transform:scale(0.93);}

/* revealed */
.cell.revealed{
  background:rgba(60,40,20,0.55);
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.4);
  cursor:default;
}
.cell.revealed.n0{background:rgba(60,40,20,0.35);}
.cell.revealed.n1{color:#5bc8ff;}
.cell.revealed.n2{color:#5bff8a;}
.cell.revealed.n3{color:#ff6b6b;}
.cell.revealed.n4{color:#c77dff;}
.cell.revealed.n5{color:#ffaa5b;}

/* egg revealed on loss */
.cell.egg-revealed{
  background:rgba(80,20,20,0.7);
  animation:eggShake 0.5s ease;
}
@keyframes eggShake{
  0%,100%{transform:rotate(0)}
  20%{transform:rotate(-8deg) scale(1.15)}
  40%{transform:rotate(8deg) scale(1.15)}
  60%{transform:rotate(-5deg)}
  80%{transform:rotate(5deg)}
}

/* flagged */
.cell.flagged{
  background:linear-gradient(145deg,#7a5a30,#5a3a18);
  box-shadow:
    2px 2px 0px #3a2010,
    inset 0 1px 0 rgba(255,255,255,0.15);
}

/* reveal animation */
@keyframes cellReveal{
  0%{transform:scale(0.7);opacity:0.3}
  60%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}
.cell.reveal-anim{
  animation:cellReveal 0.25s ease forwards;
}

/* overlay panels */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,10,26,0.88);
  backdrop-filter:blur(6px);
  padding:24px;
  gap:16px;
}
.overlay.hidden{display:none;}

.panel{
  background:linear-gradient(160deg,rgba(255,255,255,0.1),rgba(255,255,255,0.04));
  border:1.5px solid rgba(255,255,255,0.2);
  border-radius:28px;
  padding:32px 28px;
  max-width:380px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  box-shadow:0 8px 48px rgba(0,0,0,0.6);
}
.panel-emoji{font-size:4rem;line-height:1;}
.panel-title{
  font-size:1.7rem;color:#ffe066;
  text-align:center;line-height:1.3;
  text-shadow:0 0 20px rgba(255,224,102,.6);
}
.panel-msg{
  font-size:1.1rem;color:rgba(255,255,255,0.85);
  text-align:center;line-height:1.5;
}
.panel-btn{
  font-family:'Fredoka One',Arial,sans-serif;
  font-size:1.3rem;
  padding:14px 32px;
  border:none;border-radius:50px;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
  transition:transform 0.15s, box-shadow 0.15s;
  letter-spacing:0.5px;
}
.panel-btn:active{transform:scale(0.95);}
.btn-win{
  background:linear-gradient(135deg,#ffe066,#ff9f1c);
  color:#3d1a00;
}
.btn-lose{
  background:linear-gradient(135deg,#90e0ef,#0096c7);
  color:#001a2c;
}
.btn-win:hover{box-shadow:0 6px 28px rgba(255,200,30,.5);}
.btn-lose:hover{box-shadow:0 6px 28px rgba(0,150,199,.5);}

/* confetti */
#confetti-canvas{
  position:fixed;inset:0;z-index:99;
  pointer-events:none;
}

/* number text sizing */
.cell.revealed:not(.n0) span{
  font-size:1.4rem;
  font-weight:bold;
}

/* responsive cell size */
@media(max-width:380px){
  .cell{width:52px;height:52px;font-size:1.3rem;}
  #grid{gap:4px;}
}
@media(max-width:320px){
  .cell{width:44px;height:44px;font-size:1.1rem;}
  #grid{gap:3px;}
}

/* dino decorations */
#dino-deco{
  font-size:2.5rem;
  position:fixed;bottom:20px;right:16px;
  z-index:1;
  animation:dinoWalk 3s ease-in-out infinite;
  pointer-events:none;
}
@keyframes dinoWalk{
  0%,100%{transform:translateY(0) rotate(-3deg);}
  50%{transform:translateY(-8px) rotate(3deg);}
}

/* back button exact style from ptero-math */
.back-btn{
  position:fixed;top:12px;left:12px;z-index:999;
  background:rgba(0,0,0,.6);
  border:1.5px solid rgba(255,255,255,.3);
  border-radius:99px;
  padding:8px 16px;
  color:#fff;
  font-family:'Fredoka One',Arial,sans-serif;
  font-size:.85rem;
  text-decoration:none;
  transition:background 0.2s;
}
.back-btn:hover{background:rgba(0,0,0,.8);}

/* instructions hint */
#hint{
  font-size:0.85rem;
  color:rgba(255,255,255,0.4);
  text-align:center;
  letter-spacing:0.3px;
}
</style>
</head>
<body>

<div class="skybg"></div>

<a href="dino-abc-final.html" class="back-btn">⬅️ 返回</a>

<canvas id="confetti-canvas"></canvas>

<div id="app">
  <div id="hud">
    <div id="hud-top">
      <div>
        <div id="level-label">第 1 關</div>
        <div id="grid-info">3×3 沙坑</div>
      </div>
      <div style="text-align:right">
        <div id="egg-info">🥚 0 / 1 顆蛋</div>
        <div id="hint">點擊沙坑挖掘化石！</div>
      </div>
    </div>
    <div id="hud-bottom">
      <button id="mode-btn" class="dig" onclick="toggleMode()">🪣 挖沙模式</button>
    </div>
  </div>

  <div id="grid-wrapper">
    <div id="grid"></div>
  </div>
</div>

<div id="dino-deco">🦕</div>

<!-- Win overlay -->
<div id="win-overlay" class="overlay hidden">
  <div class="panel">
    <div class="panel-emoji">🎉🦕🎉</div>
    <div class="panel-title" id="win-title">恭喜通關第 1 關！</div>
    <div class="panel-msg">太棒了！你找到了所有的恐龍蛋！<br>考古隊長誇你超厲害！</div>
    <button class="panel-btn btn-win" onclick="nextLevel()">挑戰下一關 →</button>
  </div>
</div>

<!-- Lose overlay -->
<div id="lose-overlay" class="overlay hidden">
  <div class="panel">
    <div class="panel-emoji" id="lose-emoji">😢🥚</div>
    <div class="panel-title">哎呀！恐龍被嚇跑了！</div>
    <div class="panel-msg">考古隊重新整隊再試一次吧！<br>下次小心一點喔！</div>
    <button class="panel-btn btn-lose" onclick="retryLevel()">重新挑戰本關</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://iizaesirhmhfwrjgabnw.supabase.co';
const SUPA_KEY='sb_publishable_e5libYdUvxTNKMnBscUvSw_8gj3QxyY';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let currentUser=null;
sb.auth.getSession().then(({data:{session}})=>{if(session)currentUser=session.user;});
async function saveScoreToDB(game,sc){
  if(!currentUser||sc<=0)return;
  const name=currentUser.user_metadata?.full_name||currentUser.email||'玩家';
  try{await sb.from('leaderboard').insert({player_name:name,game,score:sc,user_id:currentUser.id});}catch(e){}
}

// ─── Game State ───────────────────────────────────────────────
let level = 1;
let rows, cols, numEggs;
let board = [];       // 2D array of cell objects
let firstClick = true;
let gameOver = false;
let mode = 'dig';     // 'dig' | 'flag'
let flagCount = 0;
let revealedCount = 0;

// ─── Level Config ─────────────────────────────────────────────
function getLevelConfig(lv) {
  if (lv === 1) return { rows: 3, cols: 3, eggs: 1 };
  if (lv === 2) return { rows: 4, cols: 4, eggs: 2 };
  if (lv === 3) return { rows: 5, cols: 5, eggs: 4 };
  // Level 4+: 6x6, eggs = 4 + (lv-3), max 8
  return { rows: 6, cols: 6, eggs: Math.min(4 + (lv - 3), 8) };
}

// ─── Sound Effects ────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function playBeep(freq, type, duration, vol, delay=0) {
  const ctx = getAudio();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    gain.gain.setValueAtTime(vol, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.05);
  } catch(e) {}
}

function soundDig() {
  playBeep(440, 'sine', 0.1, 0.3);
  playBeep(600, 'sine', 0.08, 0.15, 0.05);
}
function soundFlag() {
  playBeep(800, 'triangle', 0.08, 0.25);
  playBeep(1000, 'triangle', 0.08, 0.2, 0.09);
}
function soundWin() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => playBeep(f, 'triangle', 0.18, 0.35, i * 0.16));
  playBeep(1047, 'sine', 0.4, 0.4, 0.7);
}
function soundLose() {
  playBeep(400, 'sawtooth', 0.12, 0.3);
  playBeep(300, 'sawtooth', 0.12, 0.3, 0.14);
  playBeep(200, 'sawtooth', 0.3, 0.3, 0.28);
}
function soundReveal0() {
  playBeep(350, 'sine', 0.05, 0.1);
}

// ─── Board Init ───────────────────────────────────────────────
function initGame(lv) {
  level = lv;
  const cfg = getLevelConfig(lv);
  rows = cfg.rows;
  cols = cfg.cols;
  numEggs = cfg.eggs;
  firstClick = true;
  gameOver = false;
  flagCount = 0;
  revealedCount = 0;
  mode = 'dig';

  board = [];
  for (let r = 0; r < rows; r++) {
    board[r] = [];
    for (let c = 0; c < cols; c++) {
      board[r][c] = {
        isEgg: false,
        revealed: false,
        flagged: false,
        count: 0,
      };
    }
  }

  updateHUD();
  renderGrid();
  updateModeBtn();

  document.getElementById('win-overlay').classList.add('hidden');
  document.getElementById('lose-overlay').classList.add('hidden');
}

function placeEggs(safeR, safeC) {
  const safe = new Set();
  // safe zone: clicked cell + its neighbors
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const nr = safeR + dr, nc = safeC + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
        safe.add(nr * cols + nc);
      }
    }
  }

  let placed = 0;
  const all = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (!safe.has(r * cols + c)) all.push([r, c]);

  // shuffle
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }

  const count = Math.min(numEggs, all.length);
  for (let i = 0; i < count; i++) {
    const [r, c] = all[i];
    board[r][c].isEgg = true;
  }

  // recalc counts
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c].isEgg) continue;
      let cnt = 0;
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].isEgg) cnt++;
        }
      board[r][c].count = cnt;
    }
  }
}

// ─── Grid Render ──────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  // compute cell size based on screen
  const maxW = Math.min(window.innerWidth - 32, 500);
  const cellSize = Math.max(44, Math.min(64, Math.floor((maxW - (cols - 1) * 5) / cols)));
  grid.style.gap = '5px';

  grid.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell hidden';
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.fontSize = Math.floor(cellSize * 0.42) + 'px';
      cell.dataset.r = r;
      cell.dataset.c = c;

      cell.addEventListener('click', onCellClick);
      cell.addEventListener('contextmenu', (e) => { e.preventDefault(); onCellRightClick(e); });

      // long press for flag on mobile
      let pressTimer = null;
      cell.addEventListener('touchstart', (e) => {
        pressTimer = setTimeout(() => {
          pressTimer = null;
          onCellLongPress(r, c);
        }, 500);
      }, {passive:true});
      cell.addEventListener('touchend', () => { if (pressTimer) clearTimeout(pressTimer); });
      cell.addEventListener('touchmove', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });

      grid.appendChild(cell);
    }
  }
}

function getCellEl(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function updateCellEl(r, c) {
  const el = getCellEl(r, c);
  if (!el) return;
  const cell = board[r][c];

  el.className = 'cell';
  el.innerHTML = '';

  if (cell.flagged && !cell.revealed) {
    el.classList.add('hidden', 'flagged');
    el.innerHTML = '<span>🍖</span>';
  } else if (!cell.revealed) {
    el.classList.add('hidden');
  } else {
    // revealed
    el.classList.add('revealed');
    if (cell.isEgg) {
      el.classList.add('egg-revealed');
      el.innerHTML = '<span>🥚</span>';
    } else {
      el.classList.add('n' + cell.count);
      if (cell.count > 0) {
        el.innerHTML = `<span>${cell.count}</span>`;
      }
    }
  }
}

// ─── HUD Update ───────────────────────────────────────────────
function updateHUD() {
  document.getElementById('level-label').textContent = `第 ${level} 關`;
  document.getElementById('grid-info').textContent = `${rows}×${cols} 沙坑`;
  document.getElementById('egg-info').textContent = `🥚 ${flagCount} / ${numEggs} 顆蛋`;
}

function updateModeBtn() {
  const btn = document.getElementById('mode-btn');
  if (mode === 'dig') {
    btn.textContent = '🪣 挖沙模式';
    btn.className = 'dig';
  } else {
    btn.textContent = '🍖 放飼料';
    btn.className = 'flag';
  }
}

function toggleMode() {
  mode = (mode === 'dig') ? 'flag' : 'dig';
  updateModeBtn();
  soundFlag();
}

// ─── Cell Actions ─────────────────────────────────────────────
function onCellClick(e) {
  const r = parseInt(e.currentTarget.dataset.r);
  const c = parseInt(e.currentTarget.dataset.c);
  if (mode === 'dig') {
    digCell(r, c);
  } else {
    flagCell(r, c);
  }
}

function onCellRightClick(e) {
  const r = parseInt(e.currentTarget.dataset.r);
  const c = parseInt(e.currentTarget.dataset.c);
  flagCell(r, c);
}

function onCellLongPress(r, c) {
  flagCell(r, c);
}

function digCell(r, c) {
  if (gameOver) return;
  const cell = board[r][c];
  if (cell.revealed || cell.flagged) return;

  // place eggs after first click
  if (firstClick) {
    firstClick = false;
    placeEggs(r, c);
  }

  soundDig();
  reveal(r, c);
  checkWin();
}

function flagCell(r, c) {
  if (gameOver) return;
  const cell = board[r][c];
  if (cell.revealed) return;

  cell.flagged = !cell.flagged;
  flagCount += cell.flagged ? 1 : -1;
  soundFlag();
  updateCellEl(r, c);
  updateHUD();
  checkWin();
}

function reveal(r, c) {
  const cell = board[r][c];
  if (cell.revealed || cell.flagged) return;

  cell.revealed = true;
  revealedCount++;

  const el = getCellEl(r, c);
  if (el) el.classList.add('reveal-anim');

  if (cell.isEgg) {
    updateCellEl(r, c);
    triggerLose(r, c);
    return;
  }

  updateCellEl(r, c);

  // auto-expand zeros
  if (cell.count === 0) {
    soundReveal0();
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          if (!board[nr][nc].revealed && !board[nr][nc].flagged) {
            // small delay for cascade feel
            setTimeout(() => reveal(nr, nc), 20);
          }
        }
      }
    }
  }
}

// ─── Win / Lose ───────────────────────────────────────────────
function checkWin() {
  if (gameOver) return;
  const totalSafe = rows * cols - numEggs;

  // win if all safe cells revealed
  if (revealedCount >= totalSafe) {
    triggerWin();
    return;
  }

  // also win if all eggs flagged and nothing else flagged
  const allFlagged = board.flat().every(cell => !cell.isEgg || cell.flagged);
  const noWrongFlags = board.flat().every(cell => !cell.flagged || cell.isEgg);
  if (allFlagged && noWrongFlags && flagCount === numEggs) {
    triggerWin();
  }
}

function triggerWin() {
  gameOver = true;
  soundWin();
  saveScoreToDB('mine', level);
  setTimeout(() => {
    document.getElementById('win-title').textContent = `🦕 恭喜通關第 ${level} 關！`;
    document.getElementById('win-overlay').classList.remove('hidden');
    startConfetti();
  }, 300);
}

function triggerLose(eggR, eggC) {
  gameOver = true;
  soundLose();

  // reveal all eggs after short delay
  setTimeout(() => {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c].isEgg && !board[r][c].revealed) {
          board[r][c].revealed = true;
          updateCellEl(r, c);
        }
      }
    }
    setTimeout(() => {
      document.getElementById('lose-overlay').classList.remove('hidden');
    }, 400);
  }, 500);
}

function nextLevel() {
  stopConfetti();
  initGame(level + 1);
}

function retryLevel() {
  initGame(level);
}

// ─── Confetti ─────────────────────────────────────────────────
let confettiAnimId = null;
let confettiParticles = [];

function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');

  const colors = ['#ffe066','#ff6b6b','#5bc8ff','#5bff8a','#c77dff','#ffaa5b','#ff9f1c'];
  const emojis = ['🦕','🦖','🥚','⭐','🌟'];

  confettiParticles = [];
  for (let i = 0; i < 80; i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.15,
      size: 8 + Math.random() * 10,
      color: colors[Math.floor(Math.random() * colors.length)],
      emoji: Math.random() < 0.25 ? emojis[Math.floor(Math.random() * emojis.length)] : null,
      life: 1,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    confettiParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.rot += p.rotV;
      if (p.y < canvas.height + 30) alive = true;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.emoji) {
        ctx.font = p.size + 'px serif';
        ctx.fillText(p.emoji, -p.size/2, p.size/2);
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      }
      ctx.restore();
    });
    if (alive) confettiAnimId = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

function stopConfetti() {
  if (confettiAnimId) { cancelAnimationFrame(confettiAnimId); confettiAnimId = null; }
  const canvas = document.getElementById('confetti-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

// ─── Init ─────────────────────────────────────────────────────
initGame(1);
</script>
