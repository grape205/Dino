<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🦖 恐龍華容道</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow:hidden;width:100vw;height:100vh;touch-action:none}
body{background:#1a3a1a;font-family:'Fredoka One',cursive;display:flex;flex-direction:column;align-items:center}

.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 0%,#2d5a27 0%,#1a3a1a 60%,#0d1f0d 100%)}
.deco{position:fixed;z-index:0;pointer-events:none;user-select:none;font-size:3.5rem}
.sun{top:10px;right:12px;font-size:2.6rem;animation:sP 3s ease-in-out infinite}
.vol1{bottom:-6px;left:2%;opacity:.35}
.vol2{bottom:-6px;right:4%;font-size:3rem;opacity:.3}
.tr1{bottom:-4px;left:16%;font-size:3rem;opacity:.4}
.tr2{bottom:-4px;right:20%;font-size:2.6rem;opacity:.35}
.cl1{top:10px;left:8%;font-size:2rem;opacity:.55;animation:cD 9s ease-in-out infinite}
.cl2{top:24px;left:38%;font-size:1.5rem;opacity:.4;animation:cD 13s ease-in-out infinite reverse}
.fp{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:.9rem;opacity:.14;letter-spacing:20px;z-index:0}
@keyframes sP{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes cD{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}

.header{position:relative;z-index:10;width:100%;max-width:500px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0}
.back-btn{background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.25);border-radius:99px;padding:7px 14px;color:#fff;font-family:'Fredoka One',cursive;font-size:.8rem;cursor:pointer;text-decoration:none}
.pill{border-radius:99px;padding:5px 12px;font-size:.78rem;cursor:pointer}
.lv-pill{background:rgba(255,200,50,.15);border:1.5px solid #f59e0b;color:#fde68a}
.st-pill{background:rgba(255,255,100,.12);border:1.5px solid #fbbf24;color:#fde68a}

.title{position:relative;z-index:10;color:#fde68a;font-size:1.3rem;text-align:center;margin:3px 0 0;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.obj{position:relative;z-index:10;background:rgba(0,0,0,.38);border:1.5px solid rgba(255,200,50,.28);border-radius:10px;padding:4px 14px;color:#86efac;font-size:.73rem;text-align:center;margin:3px auto 0;max-width:320px}
.mbar{position:relative;z-index:10;display:flex;gap:14px;align-items:center;justify-content:center;margin:3px 0;color:#d1fae5;font-size:.8rem}
.mc{background:rgba(0,0,0,.38);border:1.5px solid rgba(74,222,128,.28);border-radius:99px;padding:2px 12px}
.par-hint{opacity:.65;font-size:.72rem}

.bwrap{position:relative;z-index:10;margin:4px auto 0;display:flex;align-items:center;justify-content:center}
.board{position:relative;border-radius:14px;border:3px solid rgba(255,255,255,.13);background:rgba(0,0,0,.32);box-shadow:0 8px 32px rgba(0,0,0,.55);overflow:visible}

.exit{position:absolute;right:-26px;color:#4ade80;font-size:1.5rem;pointer-events:none;animation:eP 1s ease-in-out infinite}
@keyframes eP{0%,100%{transform:translateX(0);opacity:1}50%{transform:translateX(4px);opacity:.65}}

.gl{position:absolute;background:rgba(255,255,255,.055);pointer-events:none}

.piece{position:absolute;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:grab;user-select:none;border:3px solid rgba(255,255,255,.32);box-shadow:0 4px 14px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.38);font-family:'Fredoka One',cursive;text-align:center;line-height:1.15;transition:box-shadow .08s}
.piece.dragging{box-shadow:0 10px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.38);cursor:grabbing;z-index:50!important}
.pt{background:linear-gradient(145deg,#4ade80,#16a34a);color:#fff}
.pb{background:linear-gradient(145deg,#a78bfa,#7c3aed);color:#fff}
.pc{background:linear-gradient(145deg,#fb923c,#ea580c);color:#fff}
.pr{background:linear-gradient(145deg,#f472b6,#db2777);color:#fff}
.pe{background:linear-gradient(145deg,#94a3b8,#64748b);color:#ddd;cursor:not-allowed;border-color:rgba(255,255,255,.18)}
.emoji{line-height:1}
.name{font-size:.55rem;opacity:.88;letter-spacing:.3px}

/* Win */
.wov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .35s}
.wov.show{opacity:1;pointer-events:all}
.wbox{background:linear-gradient(145deg,#14532d,#166534);border:3px solid #4ade80;border-radius:22px;padding:26px 28px;text-align:center;max-width:300px;width:88%;animation:wP .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes wP{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.wdino{font-size:4rem;animation:wD .5s ease-in-out infinite alternate}
@keyframes wD{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.1)}}
.wt{color:#bbf7d0;font-size:1.4rem;margin:6px 0 2px}
.ws{color:#86efac;font-size:.88rem;margin-bottom:10px}
.wstars{font-size:1.9rem;letter-spacing:4px;margin-bottom:14px}
.wbtn{background:linear-gradient(135deg,#4ade80,#16a34a);border:none;border-radius:99px;padding:11px 22px;color:#fff;font-family:'Fredoka One',cursive;font-size:.95rem;cursor:pointer;margin:4px 5px;touch-action:manipulation}
.wbtn.next{background:linear-gradient(135deg,#fbbf24,#f59e0b)}

/* Level select */
.lov{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78)}
.lbox{background:linear-gradient(145deg,#1e3a5f,#1e3a8a);border:3px solid #60a5fa;border-radius:22px;padding:20px;text-align:center;max-width:340px;width:92%}
.lbtitle{color:#bfdbfe;font-size:1.2rem;margin-bottom:14px}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.lbtn{background:rgba(255,255,255,.08);border:2px solid rgba(100,180,255,.35);border-radius:12px;padding:12px 6px;cursor:pointer;color:#e0f2fe;font-family:'Fredoka One',cursive;transition:transform .12s,background .12s;touch-action:manipulation}
.lbtn:active{transform:scale(.96);background:rgba(96,165,250,.22)}
.lbtn.ok{border-color:#4ade80}
.lbtn.locked{opacity:.38;cursor:default}
.licon{font-size:1.7rem;margin-bottom:3px}
.lname{font-size:.68rem}
.lstars{font-size:.8rem;letter-spacing:2px;min-height:1em}

.confcv{position:fixed;top:0;left:0;pointer-events:none;z-index:300;width:100vw;height:100vh}

/* puzzle popup */
#puzzle-popup{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.88);backdrop-filter:blur(8px)}
#puzzle-popup.hidden{display:none}
.pz-box{background:linear-gradient(145deg,#1a0a2e,#2d1060);border:3px solid #a855f7;border-radius:28px;padding:26px 20px;max-width:300px;width:90%;text-align:center;animation:pzPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pzPop{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.pz-title{font-size:1.4rem;color:#e879f9;text-shadow:0 0 20px rgba(232,121,249,.8);margin-bottom:6px}
.pz-piece-big{font-size:3.8rem;margin:10px 0;display:block;animation:pzSpin .6s ease}
@keyframes pzSpin{from{transform:scale(.3) rotate(180deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.pz-count{font-size:.95rem;color:#d8b4fe;margin-bottom:12px}
.pz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:175px;margin:0 auto 12px}
.pz-cell{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;border:2px solid rgba(168,85,247,.35)}
.pz-cell.pz-locked{background:rgba(0,0,0,.5);color:rgba(255,255,255,.18);font-size:1rem}
.pz-cell.pz-done{background:rgba(168,85,247,.2)}
.pz-cell.pz-new{background:rgba(168,85,247,.45);border-color:#e879f9;box-shadow:0 0 14px rgba(232,121,249,.7);animation:pzGlow .8s ease .3s both}
@keyframes pzGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.pz-complete-msg{font-size:1rem;color:#fbbf24;margin-bottom:8px;animation:pzGlow .7s ease infinite}
.pz-hint{font-size:.78rem;color:rgba(216,180,254,.65);margin-bottom:12px}
.pz-close-btn{background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:99px;padding:11px 26px;color:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;box-shadow:0 4px 14px rgba(168,85,247,.5)}
</style>
</head>
<body>

<div class="bg"></div>

<div class="deco vol2">🌋</div>

<div class="deco tr2">🌿</div>

<div class="deco cl2">☁️</div>

<!-- Puzzle Piece Reward popup -->
<div id="puzzle-popup" class="hidden">
  <div class="pz-box">
    <div class="pz-title">🧩 獲得拼圖碎片！</div>

<script>
// ── Puzzle System ──
const PUZZLE_KEY='dino_puzzle_pieces';
const PUZZLE_EMOJIS=['🌈','☁️','🌟','🌴','🦕','🌸','🌺','🥚','🌿'];
const PUZZLE_COLORS=['#4f46e5','#3b82f6','#f59e0b','#16a34a','#15803d','#be185d','#b45309','#78716c','#4d7c0f'];
function loadPuzzle(){return JSON.parse(localStorage.getItem(PUZZLE_KEY)||'null')||Array(9).fill(false);}
function awardPuzzlePiece(){
  const p=loadPuzzle();
  const av=p.map((v,i)=>!v?i:-1).filter(i=>i>=0);
  if(!av.length)return -1;
  const idx=av[Math.floor(Math.random()*av.length)];
  p[idx]=true;localStorage.setItem(PUZZLE_KEY,JSON.stringify(p));return idx;
}
function showPuzzlePopup(newIdx){
  const p=loadPuzzle();
  const col=p.filter(Boolean).length;
  document.getElementById('pz-piece-big').textContent=PUZZLE_EMOJIS[newIdx];
  document.getElementById('pz-count').textContent=`已收集 ${col} / 9 塊`;
  document.getElementById('pz-grid').innerHTML=PUZZLE_EMOJIS.map((em,i)=>{
    if(!p[i])return`<div class="pz-cell pz-locked">？</div>`;
    return`<div class="pz-cell ${i===newIdx?'pz-new':'pz-done'}" style="background:${PUZZLE_COLORS[i]}40;border-color:${PUZZLE_COLORS[i]}">${em}</div>`;
  }).join('');
  const done=col===9;
  document.getElementById('pz-complete-msg').style.display=done?'block':'none';
  document.getElementById('pz-hint').textContent=done?'🎊 太厲害了！你是拼圖大師！':`繼續玩收集剩下 ${9-col} 塊！🦖`;
  document.getElementById('puzzle-popup').classList.remove('hidden');
}
function closePuzzlePopup(){document.getElementById('puzzle-popup').classList.add('hidden');}

// ── Audio ──
let AC;
function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function beep(f,d,t='sine',v=.15){
  initAC();
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.frequency.value=f;o.type=t;
  g.gain.setValueAtTime(v,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.start();o.stop(AC.currentTime+d);
}
function sndMove(){beep(300,.07,'sine',.1);setTimeout(()=>beep(400,.07,'sine',.08),55)}
function sndBump(){beep(150,.09,'sawtooth',.07)}
function sndWin(){
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sine',.2),i*110));
  setTimeout(()=>[1047,1319,1568].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sine',.22),i*90)),550);
}

// ── Levels ──
// dir H = horizontal (moves left/right), V = vertical (moves up/down)
// trex must reach col >= cols (exit right), always H, placed at exitRow
const LEVELS=[
  // Level 1: 4×4 exitRow=1 par=2 熱身準備
  {"cols": 4, "rows": 4, "exitRow": 1, "par": 2, "name": "熱身準備", "icon": "🦕", "pieces": [{"id": "tx", "type": "t", "row": 1, "col": 0, "len": 2, "dir": "H", "em": "🦖", "nm": "小暴龍", "cs": "pt"}, {"id": "b1", "type": "b", "row": 0, "col": 2, "len": 2, "dir": "V", "em": "🦕", "nm": "長頸龍", "cs": "pb"}, {"id": "e1", "type": "e", "row": 3, "col": 3, "len": 1, "dir": "H", "em": "🥚", "nm": "恐龍蛋", "cs": "pe"}]},
  // Level 2: 4×4 exitRow=1 par=3 開始移動
  {"cols": 4, "rows": 4, "exitRow": 1, "par": 3, "name": "開始移動", "icon": "🦖", "pieces": [{"id": "tx", "type": "t", "row": 1, "col": 0, "len": 2, "dir": "H", "em": "🦖", "nm": "小暴龍", "cs": "pt"}, {"id": "b1", "type": "b", "row": 0, "col": 2, "len": 2, "dir": "V", "em": "🦕", "nm": "長頸龍", "cs": "pb"}, {"id": "c1", "type": "c", "row": 2, "col": 2, "len": 2, "dir": "H", "em": "🐊", "nm": "三角龍", "cs": "pc"}, {"id": "e1", "type": "e", "row": 3, "col": 0, "len": 1, "dir": "H", "em": "🥚", "nm": "恐龍蛋", "cs": "pe"}]},
  // Level 3: 5×5 exitRow=2 par=3 加油前進
  {"cols": 5, "rows": 5, "exitRow": 2, "par": 3, "name": "加油前進", "icon": "🐊", "pieces": [{"id": "tx", "type": "t", "row": 2, "col": 0, "len": 2, "dir": "H", "em": "🦖", "nm": "小暴龍", "cs": "pt"}, {"id": "r1", "type": "r", "row": 2, "col": 2, "len": 2, "dir": "V", "em": "🦎", "nm": "迅猛龍", "cs": "pr"}, {"id": "c1", "type": "c", "row": 0, "col": 2, "len": 2, "dir": "H", "em": "🐊", "nm": "三角龍", "cs": "pc"}, {"id": "e1", "type": "e", "row": 4, "col": 2, "len": 1, "dir": "H", "em": "🥚", "nm": "恐龍蛋", "cs": "pe"}]},
  // Level 4: 5×5 exitRow=1 par=4 勇敢挑戰
  {"cols": 5, "rows": 5, "exitRow": 1, "par": 4, "name": "勇敢挑戰", "icon": "🦎", "pieces": [{"id": "tx", "type": "t", "row": 1, "col": 0, "len": 2, "dir": "H", "em": "🦖", "nm": "小暴龍", "cs": "pt"}, {"id": "r1", "type": "r", "row": 0, "col": 2, "len": 2, "dir": "V", "em": "🦎", "nm": "迅猛龍", "cs": "pr"}, {"id": "c1", "type": "c", "row": 2, "col": 1, "len": 2, "dir": "H", "em": "🐊", "nm": "三角龍", "cs": "pc"}, {"id": "r2", "type": "r", "row": 2, "col": 3, "len": 2, "dir": "V", "em": "🦎", "nm": "迅猛龍", "cs": "pr"}, {"id": "e1", "type": "e", "row": 2, "col": 0, "len": 1, "dir": "H", "em": "🥚", "nm": "恐龍蛋", "cs": "pe"}]},
  // Level 5: 5×5 exitRow=2 par=5 超級高手
  {"cols": 5, "rows": 5, "exitRow": 2, "par": 5, "name": "超級高手", "icon": "⭐", "pieces": [{"id": "tx", "type": "t", "row": 2, "col": 0, "len": 2, "dir": "H", "em": "🦖", "nm": "小暴龍", "cs": "pt"}, {"id": "r1", "type": "r", "row": 1, "col": 2, "len": 2, "dir": "V", "em": "🦎", "nm": "迅猛龍", "cs": "pr"}, {"id": "c1", "type": "c", "row": 0, "col": 1, "len": 2, "dir": "H", "em": "🐊", "nm": "三角龍", "cs": "pc"}, {"id": "r2", "type": "r", "row": 0, "col": 3, "len": 2, "dir": "V", "em": "🦎", "nm": "迅猛龍", "cs": "pr"}, {"id": "r3", "type": "r", "row": 0, "col": 4, "len": 2, "dir": "V", "em": "🦎", "nm": "迅猛龍", "cs": "pr"}, {"id": "e1", "type": "e", "row": 0, "col": 0, "len": 1, "dir": "H", "em": "🥚", "nm": "恐龍蛋", "cs": "pe"}, {"id": "e2", "type": "e", "row": 3, "col": 2, "len": 1, "dir": "H", "em": "🥚", "nm": "恐龍蛋", "cs": "pe"}]},
  // Level 6: 6×6 exitRow=2 par=6 恐龍勇士

let curLv=0, moves=0, CELL=60;
let pieces=[];
let totalStars=JSON.parse(localStorage.getItem('hr_stars')||'[]');

// ── Global drag state ──
// Attached once to document; pieces just set this on pointerdown
let drag=null;

document.addEventListener('pointermove', onPtrMove);
document.addEventListener('pointerup',   onPtrUp);
document.addEventListener('pointercancel', ()=>{ if(drag){cancelDrag();}});

function onPtrMove(e){
  if(!drag) return;
  e.preventDefault();
  const {p,el,x0,y0,c0,r0,maxL,maxR,maxU,maxD}=drag;
  if(p.dir==='H'){
    const dx=e.clientX-x0;
    const lo=-maxL*CELL, hi=maxR*CELL;
    const clamped=Math.max(lo,Math.min(hi,dx));
    el.style.left=(c0*CELL+3+clamped)+'px';
  }else{
    const dy=e.clientY-y0;
    const lo=-maxU*CELL, hi=maxD*CELL;
    const clamped=Math.max(lo,Math.min(hi,dy));
    el.style.top=(r0*CELL+3+clamped)+'px';
  }
}

function onPtrUp(e){
  if(!drag) return;
  e.preventDefault();
  const saved=drag; drag=null;
  const {p,el,x0,y0,c0,r0,maxL,maxR,maxU,maxD}=saved;
  el.classList.remove('dragging');
  el.releasePointerCapture&&el.releasePointerCapture(saved.pid);

  const dx=e.clientX-x0, dy=e.clientY-y0;
  let steps=0;
  if(p.dir==='H'){
    const raw=dx/CELL;
    if(raw>0) steps=Math.min(Math.round(raw), maxR);
    else       steps=Math.max(Math.round(raw),-maxL);
  }else{
    const raw=dy/CELL;
    if(raw>0) steps=Math.min(Math.round(raw),maxD);
    else       steps=Math.max(Math.round(raw),-maxU);
  }
  p.col=c0; p.row=r0;
  if(steps!==0) commitMove(p,steps);
  else{ renderPiece(p); sndBump(); }
}

function cancelDrag(){
  if(!drag)return;
  const {p,el,c0,r0}=drag; drag=null;
  el.classList.remove('dragging');
  p.col=c0; p.row=r0; renderPiece(p);
}

// ── Drag start ──
function setupPiece(el,p){
  if(p.type==='e') return;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    initAC();
    // pre-compute max moves before drag starts (grid is current)
    const mL=calcMax(p,-1), mR=calcMax(p,1);
    drag={p,el,x0:e.clientX,y0:e.clientY,c0:p.col,r0:p.row,
          maxL:mL,maxR:mR,maxU:mL,maxD:mR,pid:e.pointerId};
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
}

// ── Grid occupancy ──
function buildGrid(){
  const lv=LEVELS[curLv];
  const g=Array.from({length:lv.rows},()=>Array(lv.cols).fill(null));
  pieces.forEach(p=>{
    for(let i=0;i<p.len;i++){
      const r=p.dir==='V'?p.row+i:p.row;
      const c=p.dir==='H'?p.col+i:p.col;
      if(r>=0&&r<lv.rows&&c>=0&&c<lv.cols) g[r][c]=p.id;
    }
  });
  return g;
}

function calcMax(p,dir){
  const g=buildGrid();
  const lv=LEVELS[curLv];
  let s=0;
  if(p.dir==='H'){
    if(dir<0){let c=p.col-1;    while(c>=0&&!g[p.row][c]){s++;c--;}}
    else      {let c=p.col+p.len;while(c<lv.cols&&!g[p.row][c]){s++;c++;}
               if(p.type==='t'&&c>=lv.cols)s++;}
  }else{
    if(dir<0){let r=p.row-1;    while(r>=0&&!g[r][p.col]){s++;r--;}}
    else      {let r=p.row+p.len;while(r<lv.rows&&!g[r][p.col]){s++;r++;}}
  }
  return s;
}

function commitMove(p,steps){
  if(p.dir==='H') p.col+=steps; else p.row+=steps;
  moves++;
  document.getElementById('mn').textContent=moves;
  sndMove();
  renderPiece(p);
  // win: trex's right edge past grid boundary
  const lv=LEVELS[curLv];
  if(p.type==='t'&&p.col+p.len>lv.cols) setTimeout(triggerWin,200);
}

// ── Render ──
function calcCELL(){
  const lv=LEVELS[curLv];
  const maxW=Math.floor(window.innerWidth*.88/lv.cols);
  const availH=window.innerHeight-190;
  const maxH=Math.floor(availH/lv.rows);
  return Math.min(maxW,maxH,76);
}

function renderBoard(){
  const lv=LEVELS[curLv];
  CELL=calcCELL();
  const board=document.getElementById('board');
  board.style.width=lv.cols*CELL+'px';
  board.style.height=lv.rows*CELL+'px';
  // exit arrow
  const ea=document.getElementById('exitArr');
  ea.style.top=(lv.exitRow*CELL+(CELL-26)/2)+'px';
  // clear old pieces + grid lines
  [...board.querySelectorAll('.piece,.gl')].forEach(e=>e.remove());
  // grid lines
  for(let r=1;r<lv.rows;r++){
    const l=document.createElement('div');
    l.className='gl';l.style.cssText=`left:0;right:0;top:${r*CELL}px;height:1px`;
    board.appendChild(l);
  }
  for(let c=1;c<lv.cols;c++){
    const l=document.createElement('div');
    l.className='gl';l.style.cssText=`top:0;bottom:0;left:${c*CELL}px;width:1px`;
    board.appendChild(l);
  }
  pieces.forEach(p=>{
    const el=document.createElement('div');
    el.className='piece '+p.cs;
    el.id='pc-'+p.id;
    const ems=p.len>=3?'2.2rem':p.len===2?'1.8rem':'1.3rem';
    el.innerHTML=`<div class="emoji" style="font-size:${ems}">${p.em}</div><div class="name">${p.nm}</div>`;
    board.appendChild(el);
    setupPiece(el,p);
    renderPiece(p);
  });
}

function renderPiece(p){
  const el=document.getElementById('pc-'+p.id);
  if(!el)return;
  const pw=p.dir==='H'?p.len*CELL-6:CELL-6;
  const ph=p.dir==='V'?p.len*CELL-6:CELL-6;
  el.style.left=p.col*CELL+3+'px';
  el.style.top= p.row*CELL+3+'px';
  el.style.width=pw+'px';
  el.style.height=ph+'px';
}

// ── Win ──
function triggerWin(){
  sndWin();
  const lv=LEVELS[curLv];
  const stars=moves<=lv.par?3:moves<=lv.par+2?2:1;
  if(!(totalStars[curLv]>=stars)){totalStars[curLv]=stars;localStorage.setItem('hr_stars',JSON.stringify(totalStars));}
  document.getElementById('stPill').textContent='⭐ '+totalStars.reduce((a,b)=>a+(b||0),0);
  document.getElementById('wstars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('nxtBtn').style.display=curLv<LEVELS.length-1?'':'none';
  document.getElementById('wov').classList.add('show');
  confetti();
  trySaveScore(stars*(10-curLv));

  // sync to global star system
  const gs=parseInt(localStorage.getItem('stars')||'0');
  localStorage.setItem('stars',gs+stars);

  // award puzzle piece on level 1
  if(curLv===0){
    setTimeout(()=>{
      const np=awardPuzzlePiece();
      if(np>=0){
        document.getElementById('wov').classList.remove('show');
        showPuzzlePopup(np);
      }
    },1800);
  }
}
async function trySaveScore(sc){
  try{
    const sb=window._sb||window.supabase;
    const u=window._currentUser;
    if(!sb||!u)return;
    await sb.from('leaderboard').insert({player_name:u.user_metadata?.full_name||u.email,game:'huarong',score:sc,user_id:u.id});
  }catch(_){}
}

function restartLv(){document.getElementById('wov').classList.remove('show');loadLevel(curLv);}
function nextLv(){document.getElementById('wov').classList.remove('show');if(curLv<LEVELS.length-1)loadLevel(curLv+1);}

// ── Level select ──
function openLvl(){
  const g=document.getElementById('lgrid');
  g.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const s=totalStars[i]||0;
    const unlocked=i===0||(totalStars[i-1]||0)>0;
    const d=document.createElement('div');
    d.className='lbtn'+(unlocked?' ok':' locked');
    d.innerHTML=`<div class="licon">${lv.icon}</div><div class="lname">第${i+1}關<br>${lv.name}</div><div class="lstars">${s?'⭐'.repeat(s)+'☆'.repeat(3-s):'☆☆☆'}</div>`;
    if(unlocked) d.onclick=()=>{closeLvl();loadLevel(i);};
    g.appendChild(d);
  });
  document.getElementById('lov').style.display='flex';
}
function closeLvl(){document.getElementById('lov').style.display='none';}

// ── Load level ──
function loadLevel(idx){
  curLv=idx; moves=0;
  document.getElementById('mn').textContent=0;
  document.getElementById('lvPill').textContent='第 '+(idx+1)+' 關';
  document.getElementById('ph').textContent='目標：'+LEVELS[idx].par+'步以內 ⭐⭐⭐';
  pieces=LEVELS[idx].pieces.map(p=>({...p}));
  renderBoard();
}

// ── Confetti ──
function confetti(){
  const cv=document.getElementById('cv');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const colors=['#4ade80','#fbbf24','#f472b6','#60a5fa','#a78bfa','#fb923c'];
  const pts=Array.from({length:75},()=>({
    x:Math.random()*cv.width,y:-16,
    vx:(Math.random()-.5)*3.5,vy:Math.random()*3.5+1.5,
    r:Math.random()*7+3,c:colors[Math.random()*colors.length|0],rot:Math.random()*360,vr:(Math.random()-.5)*7
  }));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);ctx.restore();});
    if(++f<100)requestAnimationFrame(draw); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

// ── Init ──
document.getElementById('stPill').textContent='⭐ '+totalStars.reduce((a,b)=>a+(b||0),0);
loadLevel(0);
</script>
